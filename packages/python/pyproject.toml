[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sol-feed"
version = "0.1.1"
description = "Python client for the Lunar Shadow Labs feed: decoded Solana DEX swaps, launches and pool events over one WebSocket"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lunar Shadow Labs", email = "support@lunarshadowlabs.com" }]
requires-python = ">=3.9"
dependencies = ["websockets>=13"]
keywords = ["solana", "dex", "websocket", "market-data", "pump.fun", "raydium", "meteora", "orca", "token-2022"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://lunarshadowlabs.com"
Documentation = "https://lunarshadowlabs.com/docs/"
Source = "https://github.com/lunarshadowlabs/sol-feed-examples"

[tool.hatch.build.targets.wheel]
packages = ["src/sol_feed"]
