# Publishes the client packages with trusted publishing (OIDC): no npm, PyPI or crates.io token is
# stored anywhere (crates.io needs a token once, for the first version; see below). Push a tag to release:
#   js-v0.1.1  -> packages/js      -> npm  "sol-feed"
#   py-v0.1.1  -> packages/python  -> PyPI "sol-feed"
#   rs-v0.1.1  -> packages/rust    -> crates.io "sol-feed"
# The tag must match the version in package.json / pyproject.toml / Cargo.toml or the job fails
# before publishing. Each registry must list this repo + "release.yml" + the environment below as a
# trusted publisher. crates.io only allows that once the crate exists, so its very first version
# is published by hand with an API token; every later version goes through this workflow.
name: release

on:
  push:
    tags: ["js-v*", "py-v*", "rs-v*"]

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'js-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - name: Tag matches package.json
        run: |
          want="${GITHUB_REF_NAME#js-v}"
          have="$(node -p 'require("./package.json").version')"
          [ "$want" = "$have" ] || { echo "tag $want != package.json $have"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm publish

  pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject.toml
        working-directory: packages/python
        run: |
          want="${GITHUB_REF_NAME#py-v}"
          have="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$want" = "$have" ] || { echo "tag $want != pyproject.toml $have"; exit 1; }
      - name: Test
        working-directory: packages/python
        run: |
          python -m pip install . pytest
          python -m pytest -q
      - name: Build
        working-directory: packages/python
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  crates-io:
    if: startsWith(github.ref_name, 'rs-v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Tag matches Cargo.toml
        run: |
          want="${GITHUB_REF_NAME#rs-v}"
          have="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "$want" = "$have" ] || { echo "tag $want != Cargo.toml $have"; exit 1; }
      - run: cargo test
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
