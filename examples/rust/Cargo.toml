[package]
name = "stream-swaps"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }   # TLS crypto: exactly one provider
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
